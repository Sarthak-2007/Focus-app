# DRAFT — issue #3 cell (Fern lead), for Ren to land on main.
# Identical to .github/workflows/rescue-build.yml on main EXCEPT the one
# added step marked "ISSUE-3 FIX". Stored outside .github/workflows/ so
# this branch never executes its own draft.
name: rescue-build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"
      # ISSUE-3 FIX: app/build.gradle.kts signs the debug build with
      # signingConfig "debugConfig" -> storeFile ${rootDir}/debug.keystore
      # (standard Android debug key, password "android", alias
      # "androiddebugkey"). debug.keystore is .gitignore line 18 — never
      # committed — so every clean runner fails :app:validateSigningDebug
      # (proven by run #4, 40957609929). Generate the identical standard
      # key at the repo root before assembling. keytool ships with the JDK.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Assemble debug
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest
