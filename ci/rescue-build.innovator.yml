# INNOVATOR DRAFT — issue #3 cell, for Ren to consider AFTER the minimal
# keystore fix (ci/rescue-build.draft.yml) has proven the circuit.
# Full rationale: Innovator's report + comment on issue #3.
# Changes vs main: split build/test jobs, Gradle caching, push path
# filters, timeouts, per-ref concurrency, SHA-pinned actions (v5),
# ubuntu-24.04 pin, step summaries + diagnostics/test-report artifacts.
name: rescue-build

run-name: rescue-build · ${{ github.ref_name }} · ${{ github.actor }}

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.env.example'
      - '.github/workflows/rescue-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install SDK platform 36.1
        timeout-minutes: 10
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            echo "platforms;android-36.1 already present — skipping"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"
          fi
      - name: Ensure debug keystore
        timeout-minutes: 2
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore present — using it"
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Assemble debug
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleDebug
      - name: Record APK fingerprint
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "## Debug APK"
            echo "- file: \`$APK\`"
            echo "- size: $(stat -c%s "$APK") bytes"
            echo "- sha256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monolith-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          compression-level: 0
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monolith-build-diagnostics
          path: |
            build/reports/problems/
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install SDK platform 36.1
        timeout-minutes: 10
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$ANDROID_HOME/platforms/android-36.1" ]; then
            echo "platforms;android-36.1 already present — skipping"
          else
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"
          fi
      - name: Ensure debug keystore
        timeout-minutes: 2
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      # NO continue-on-error: a red test verdict must stay red.
      - name: Unit tests
        id: unit-tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest
      - name: Summarise test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Unit tests\n')
              if not files:
                  out.write('No JUnit XML produced — tests did not execute (compilation failure or earlier error). See the raw log.\n')
              else:
                  t = f = e = s = 0
                  failures = []
                  for path in files:
                      root = ET.parse(path).getroot()
                      t += int(root.get('tests', 0)); f += int(root.get('failures', 0))
                      e += int(root.get('errors', 0)); s += int(root.get('skipped', 0))
                      for case in root.iter('testcase'):
                          if case.find('failure') is not None or case.find('error') is not None:
                              failures.append(f"{case.get('classname')}.{case.get('name')}")
                  out.write(f"- tests: {t} · failures: {f} · errors: {e} · skipped: {s}\n")
                  for name in failures[:50]:
                      out.write(f"- ❌ `{name}`\n")
          PYEOF
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monolith-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14
