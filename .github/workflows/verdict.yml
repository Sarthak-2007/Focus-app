name: durch-fin-verdict
on:
  push:
    branches: [agent/durch-fin-verdict-480, agent/durch-fin-verdict-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: true
      - name: Install SDK platform 36.1
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1 || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"
      - name: Compile + unit tests (verdict capture)
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --console=plain testDebugUnitTest > verdict-console.log 2>&1
          echo "GRADLE_EXIT=$?" >> verdict-console.log
          ./gradlew --console=plain assembleDebug >> verdict-console.log 2>&1
          echo "ASSEMBLE_EXIT=$?" >> verdict-console.log
          ls -la app/build/outputs/apk/debug/ >> verdict-console.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verdict-${{ github.sha }}
          path: |
            verdict-console.log
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 3
