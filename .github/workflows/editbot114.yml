name: editbot-114
on:
  push:
    branches: [mergebot/edit-114]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-114
          path: target
          fetch-depth: 0
      - name: Apply edit, push, report status
        run: |
          cd target
          git config user.name "STURM3-11 editbot"
          git config user.email "sturm3-11@users.noreply.github.com"
          if python3 ../edit114.py; then
            git add -A
            git commit -m "Issue #114: de-duplicate peek launch - one launch, after the lease row (STURM3-11)"
            git push origin HEAD:agent/issue-114
            echo "status=edited" > ../edit-status-114.txt
          else
            echo "status=aborted" > ../edit-status-114.txt
          fi
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ" >> ../edit-status-114.txt
          cd ..
          git config user.name "STURM3-11 editbot"
          git config user.email "sturm3-11@users.noreply.github.com"
          git add edit-status-114.txt
          git commit -m "editbot-114 status [skip ci]" || true
          git push origin HEAD:mergebot/edit-114
