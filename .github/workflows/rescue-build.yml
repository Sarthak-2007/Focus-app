name: rescue-build

on:
  workflow_dispatch:
  push:
    # Methods-2 (TAKT-2): a push that changes ONLY markdown / studio
    # plan files cannot change the build — skip the 5–17 min run.
    # (paths-ignore skips only when EVERY changed file matches.)
    paths-ignore:
      - '**.md'
      - 'studio/**'

# Methods-2: a newer push to the same branch supersedes the old run.
# Tonight's fleet pushed in bursts and paid full price for runs whose
# verdicts nobody would ever read. Cancel the stale ones.
concurrency:
  group: rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Wave-2 (issue #3): the 360-minute platform default meant one
    # hung daemon could eat a large share of the monthly minutes.
    # Longest legitimate run so far is ~6 minutes; 25 is generous
    # headroom, not a squeeze (FINDINGS' proposed value).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Methods-2 (TAKT-2): persist the Gradle user home (dependency
      # cache, build cache, configuration cache) across runs. Until
      # now every run was cold: wrapper + all dependencies downloaded
      # from scratch (~200 runs/day fleet-wide). Scout-2 find 8 /
      # WAVE2-METHODS 1.1, finally landed. Branches other than main
      # restore but do not write the cache, so half-finished branch
      # states can't poison it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install SDK platform 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"

      # ISSUE-3 FIX (Wave-2, landed on agent/issue-3 by Fuge's cell;
      # first filed as ci/rescue-build.draft.yml by Fern's cell).
      #
      # app/build.gradle.kts signs the debug build with signingConfig
      # "debugConfig" -> storeFile ${rootDir}/debug.keystore (standard
      # Android debug key: password "android", alias
      # "androiddebugkey"). debug.keystore is .gitignore line 18 —
      # never committed — so every clean runner failed
      # :app:validateSigningDebug (runs #4-#7, identical, after full
      # Kotlin compilation had passed).
      #
      # Generate the identical standard key at the repo root, where
      # debugConfig expects it, before assembling. keytool ships with
      # the JDK installed above; no new dependency, no repo change,
      # no binary in history. The guard keeps a locally committed
      # keystore (if Ren ever chooses that route) untouched.
      - name: Generate debug keystore (issue #3 fix)
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present — using it as-is"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug
        id: assemble
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Unit tests
        id: tests
        run: ./gradlew --console=plain testDebugUnitTest

      # Methods-2: the JUnit XML is the verdict. Upload it so a lead
      # reads counts from an artifact instead of log-diving a
      # 14-minute step (tonight's standard verdict-reading cost).
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 3
          if-no-files-found: ignore

      # Wave-2 (Feel/Finisher pass): the run page must tell the truth
      # in plain words without anyone opening a log. This APK is
      # uploaded BEFORE the test step, so while tests are red the
      # artifact is UNTESTED — the summary says so, every run.
      - name: Verdict summary
        if: always()
        run: |
          {
            echo "## Build verdict — ${{ github.ref_name }} · ${{ github.sha }}"
            echo "- Assemble debug: ${{ steps.assemble.outcome }}"
            echo "- Unit tests executed: ${{ steps.tests.outcome != 'skipped' }}"
            echo "- Unit test verdict: ${{ steps.tests.outcome }}"
            # Methods-2: counts from the JUnit XML — the verdict in
            # numbers, on the run page, without opening a log.
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY" || true
            import glob, xml.etree.ElementTree as ET
            t = f = e = s = 0
            for p in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
                r = ET.parse(p).getroot()
                t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
                e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
            if t:
                print(f"- Unit test counts: {t} run · {f} failures · {e} errors · {s} skipped")
            PYEOF
            if [ "${{ steps.tests.outcome }}" != "success" ]; then
              echo "- ⚠️ The uploaded APK is UNTESTED in this run — its unit tests did not pass. Do not treat it as proven."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
