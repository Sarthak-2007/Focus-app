name: rescue-build

on:
  workflow_dispatch:
  push:
  pull_request:

# Issue #24: least privilege — this workflow only reads the repo.
permissions:
  contents: read

# Issue #24: per-PR/per-ref concurrency. PR syncs cancel their own stale
# runs; a push to main is NEVER cancelled by another event (the group key
# differs and cancel-in-progress is false outside pull_request).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Wave-2 (issue #3): the 360-minute platform default meant one
    # hung daemon could eat a large share of the monthly minutes.
    # Longest legitimate run so far is ~6 minutes; 25 is generous
    # headroom, not a squeeze (FINDINGS' proposed value).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Issue #24: Gradle build cache (was: every run cold). Branch/PR
      # runs read the cache but never write it — main owns cache writes.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install SDK platform 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1 || { echo "::warning::sdkmanager license step failed — see log tail"; tail -20 /tmp/sdk-licenses.log; }
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"

      # ISSUE-3 FIX (Wave-2, landed on agent/issue-3 by Fuge's cell;
      # first filed as ci/rescue-build.draft.yml by Fern's cell).
      #
      # app/build.gradle.kts signs the debug build with signingConfig
      # "debugConfig" -> storeFile ${rootDir}/debug.keystore (standard
      # Android debug key: password "android", alias
      # "androiddebugkey"). debug.keystore is .gitignore line 18 —
      # never committed — so every clean runner failed
      # :app:validateSigningDebug (runs #4-#7, identical, after full
      # Kotlin compilation had passed).
      #
      # Generate the identical standard key at the repo root, where
      # debugConfig expects it, before assembling. keytool ships with
      # the JDK installed above; no new dependency, no repo change,
      # no binary in history. The guard keeps a locally committed
      # keystore (if Ren ever chooses that route) untouched.
      - name: Generate debug keystore (issue #3 fix)
        id: keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present — using it as-is"
            echo "source=committed" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Issue #24 (finding 1): unit tests run BEFORE the artifact is
      # built or uploaded. Single job on purpose: parallel jobs would
      # split the run across two checkouts and two Gradle homes inside
      # GitHub's included-minutes budget. If tests fail the job stops
      # here — no APK is produced at all.
      - name: Unit tests
        id: tests
        run: |
          chmod +x gradlew
          ./gradlew --console=plain testDebugUnitTest

      - name: Assemble debug
        id: assemble
        run: ./gradlew --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # Wave-2 (Feel/Finisher pass): the run page must tell the truth
      # in plain words without anyone opening a log. This APK is
      # uploaded BEFORE the test step, so while tests are red the
      # artifact is UNTESTED — the summary says so, every run.
      - name: Verdict summary
        if: always()
        run: |
          {
            echo "## Build verdict — ${{ github.ref_name }} · ${{ github.sha }}"
            echo "- Assemble debug: ${{ steps.assemble.outcome }}"
            echo "- Unit tests executed: ${{ steps.tests.outcome != 'skipped' }}"
            echo "- Unit test verdict: ${{ steps.tests.outcome }}"
            if [ "${{ steps.tests.outcome }}" != "success" ]; then
              echo "- ⚠️ NO APK was uploaded in this run — the artifact is only built after unit tests pass."
            else
              echo "- APK in this run was built and uploaded AFTER its unit tests passed."
            fi
            if [ "${{ steps.keystore.outputs.source }}" = "generated" ]; then
              echo "- ⛔ SIGNING: this run generated a FRESH debug key on the runner. Its APK is NOT installable over the installed Monolith (different signing key) — proof only, do not install."
            else
              FP=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | grep -m1 "SHA1:" | sed 's/.*SHA1: *//')
              echo "- Signing: committed standard debug keystore (SHA1 $FP) — same key as local builds, installable over the installed Monolith."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
