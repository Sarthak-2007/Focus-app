name: rescue-build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    # Wave-2 (issue #3): the 360-minute platform default meant one
    # hung daemon could eat a large share of the monthly minutes.
    # Longest legitimate run so far is ~6 minutes; 25 is generous
    # headroom, not a squeeze (FINDINGS' proposed value).
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform 36.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.1.0"

      # ISSUE-3 FIX (Wave-2, landed on agent/issue-3 by Fuge's cell;
      # first filed as ci/rescue-build.draft.yml by Fern's cell).
      #
      # app/build.gradle.kts signs the debug build with signingConfig
      # "debugConfig" -> storeFile ${rootDir}/debug.keystore (standard
      # Android debug key: password "android", alias
      # "androiddebugkey"). debug.keystore is .gitignore line 18 —
      # never committed — so every clean runner failed
      # :app:validateSigningDebug (runs #4-#7, identical, after full
      # Kotlin compilation had passed).
      #
      # Generate the identical standard key at the repo root, where
      # debugConfig expects it, before assembling. keytool ships with
      # the JDK installed above; no new dependency, no repo change,
      # no binary in history. The guard keeps a locally committed
      # keystore (if Ren ever chooses that route) untouched.
      - name: Generate debug keystore (issue #3 fix)
        run: |
          if [ -f debug.keystore ]; then
            echo "debug.keystore already present — using it as-is"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble debug
        id: assemble
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: monolith-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      - name: Unit tests
        id: tests
        run: ./gradlew --console=plain testDebugUnitTest

      # Wave-2 (Feel/Finisher pass): the run page must tell the truth
      # in plain words without anyone opening a log. This APK is
      # uploaded BEFORE the test step, so while tests are red the
      # artifact is UNTESTED — the summary says so, every run.
      - name: Verdict summary
        if: always()
        run: |
          {
            echo "## Build verdict — ${{ github.ref_name }} · ${{ github.sha }}"
            echo "- Assemble debug: ${{ steps.assemble.outcome }}"
            echo "- Unit tests executed: ${{ steps.tests.outcome != 'skipped' }}"
            echo "- Unit test verdict: ${{ steps.tests.outcome }}"
            if [ "${{ steps.tests.outcome }}" != "success" ]; then
              echo "- ⚠️ The uploaded APK is UNTESTED in this run — its unit tests did not pass. Do not treat it as proven."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
